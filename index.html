<!DOCTYPE html>
<html>
<head>
<title>AR Cybersecurity Awareness</title>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

</head>

<body style="margin:0px; overflow:hidden;">

<a-scene embedded arjs>

<!-- Marker -->
<a-marker preset="hiro">

<!-- Password Security Lock -->

<a-box
position="0 0.3 0"
depth="0.4"
height="0.6"
width="0.6"
color="blue">
</a-box>

<a-torus
radius="0.3"
radius-tubular="0.05"
position="0 0.8 0"
color="silver">
</a-torus>

<a-text
value="Use Strong Passwords"
color="green"
position="-1 1.3 0">
</a-text>

</a-marker>

<a-entity camera></a-entity>

</a-scene>

</body>
</html>
